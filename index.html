<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081426">
<title>WORLDORA | The World Is Yours to Explore</title>
<meta name="description" content="Explore the world, history, culture and tourism.">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
 --bg:#081426;
 --panel:#10243c;
 --gold:#e5bd70;
 --text:#f6f2e9;
 --muted:#aebdd0;
 --border:#2a425e;
}
* {box-sizing:border-box}
body {
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Tahoma,sans-serif;
 line-height:1.7;
}
button,input,select {font:inherit}
button {cursor:pointer}
a {color:var(--gold);text-decoration:none}
header {
 position:sticky;
 top:0;
 z-index:1000;
 background:#081426;
 border-bottom:1px solid var(--border);
}
.wrap {width:min(1180px,92%);margin:auto}
nav {
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 min-height:70px;
 flex-wrap:wrap;
}
.logo {
 font-size:26px;
 font-weight:900;
 letter-spacing:2px;
 color:var(--gold);
}
.logo span {color:white}
.links {display:flex;gap:15px;flex-wrap:wrap}
.links a {font-size:13px;color:white}
.links a:hover {color:var(--gold)}
.lang {
 background:transparent;
 color:var(--gold);
 border:1px solid var(--gold);
 border-radius:8px;
 padding:7px;
}
.hero {
 text-align:center;
 padding:65px 12px;
 background:radial-gradient(ellipse at top,#1c3959,#081426 70%);
}
.eyebrow {color:var(--gold);letter-spacing:3px;font-size:12px}
.hero h1 {
 font-size:clamp(44px,9vw,82px);
 color:var(--gold);
 letter-spacing:5px;
 line-height:1.2;
 margin:12px;
}
.hero h2 {font-size:clamp(18px,3vw,27px);font-weight:500}
.hero p {max-width:750px;color:var(--muted);margin:12px auto}
.search {
 max-width:760px;
 margin:25px auto 0;
 display:flex;
 gap:8px;
 padding:8px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:12px;
}
.search input {
 flex:1;
 min-width:0;
 background:transparent;
 color:white;
 border:0;
 outline:0;
 padding:12px;
}
.gold {
 background:var(--gold);
 color:#182437;
 border:0;
 border-radius:8px;
 padding:11px 20px;
 font-weight:bold;
}
.gold:hover {background:#f4d99e}
section {padding:42px 0}
.heading {
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:12px;
 margin-bottom:20px;
 flex-wrap:wrap;
}
.heading h2 {margin:0;color:var(--gold);font-size:26px}
.heading p,.note {color:var(--muted);font-size:13px}
select,.secondary {
 background:var(--panel);
 color:white;
 border:1px solid var(--border);
 border-radius:8px;
 padding:10px;
}
.filters {display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}
.status {font-size:13px;color:var(--muted);margin:12px 0}
.grid {
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:15px;
}
.country,.feature {
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:13px;
 overflow:hidden;
}
.country:hover,.feature:hover {border-color:var(--gold)}
.flag {
 height:120px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#142b45;
}
.flag img {max-width:85%;max-height:90px;object-fit:contain}
.countrybody {padding:13px}
.country h3 {color:var(--gold);margin:0;font-size:18px}
.country p,.feature p {color:var(--muted);font-size:13px}
.country button {width:100%;margin-top:10px}
.features {
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}
.feature {padding:20px}
.feature .icon {font-size:30px}
.feature h3 {color:var(--gold)}
#worldMap {
 height:410px;
 border-radius:12px;
 overflow:hidden;
 border:1px solid var(--border);
}
.ai {
 padding:23px;
 background:linear-gradient(135deg,#172e49,#0c1b2e);
 border:1px solid #8c744c;
 border-radius:15px;
}
.ai h2 {color:var(--gold)}
.chat {
 background:#081426;
 border:1px solid var(--border);
 border-radius:10px;
 padding:12px;
 min-height:120px;
 max-height:260px;
 overflow:auto;
}
.message {padding:9px 12px;border-radius:9px;margin:8px 0;white-space:pre-wrap}
.bot {background:#18324e}
.user {background:#51432c;margin-inline-start:auto;max-width:90%}
.chatrow {display:flex;gap:8px;margin-top:10px}
.chatrow input {
 flex:1;
 min-width:0;
 background:#081426;
 color:white;
 border:1px solid var(--border);
 border-radius:8px;
 padding:11px;
}
footer {
 text-align:center;
 padding:28px;
 border-top:1px solid var(--border);
 color:var(--muted);
}
footer strong {color:var(--gold)}
.modal {
 display:none;
 position:fixed;
 inset:0;
 z-index:2000;
 background:#000b;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal.open {display:flex}
.modalbox {
 width:min(680px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--panel);
 border:1px solid var(--gold);
 border-radius:14px;
 padding:20px;
}
.modalhead {display:flex;justify-content:space-between;align-items:center}
.modalhead h2 {color:var(--gold)}
.close {font-size:27px;background:none;border:0;color:white}
.details {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail {
 padding:11px;
 background:#0b1a2d;
 border:1px solid var(--border);
 border-radius:8px;
 overflow-wrap:anywhere;
}
.detail small {display:block;color:var(--gold)}
@media(max-width:900px) {
 .grid {grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:650px) {
 .grid {grid-template-columns:repeat(2,minmax(0,1fr))}
 .features {grid-template-columns:1fr}
 .search {flex-direction:column}
 #worldMap {height:320px}
 .details {grid-template-columns:1fr}
}
@media(max-width:370px) {
 .grid {grid-template-columns:1fr}
}
</style>
</head>
